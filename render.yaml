services:
  - type: web
    name: medusa-ai-dropship
    runtime: node
    plan: free
    region: oregon
    branch: main
    repo: https://github.com/shalomawania874-lgtm/medusa-ai-dropship
    buildCommand: cd apps/backend && npm install --legacy-peer-deps --no-audit --no-fund && npm run build && cd .medusa/server && npm install --legacy-peer-deps --omit=dev --no-audit --no-fund && cd ../.. && npx medusa db:migrate --skip-links --skip-search
    startCommand: node apps/backend/.medusa/server/index.js
    healthCheckPath: /health
